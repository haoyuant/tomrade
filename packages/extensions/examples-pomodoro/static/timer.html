<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>
*{box-sizing:border-box}body{margin:0;padding:5px;font:12px system-ui;color:#eee9df;user-select:none}main{height:144px;border-radius:14px;background:#262b28;border:1px solid #697369;padding:12px;overflow:hidden;position:relative}header{display:flex;justify-content:space-between;align-items:center;cursor:grab;touch-action:none;-webkit-app-region:drag}header button{-webkit-app-region:no-drag}.clock{font-size:36px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px}.line{display:flex;align-items:center;justify-content:space-between;margin:4px 0}.detail{color:#b7c3b7;font-size:11px}nav{display:flex;gap:5px}button{background:#3b453e;color:inherit;border:1px solid #647365;border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}button:hover{background:#526052}#toggle{background:#c7dfaa;color:#263225;border-color:#c7dfaa}#progress{position:absolute;bottom:0;left:0;height:3px;background:#c7dfaa;transition:width .3s}header button{padding:2px 6px;font-size:11px}button:focus-visible{outline:2px solid #c7dfaa;outline-offset:2px}
</style></head><body><main><header><span id="title"></span><span><button id="settings"></button> <button id="mode"></button></span></header><div class="line"><span class="clock" id="clock">25:00</span><span id="phase"></span></div><div class="detail" id="detail"></div><nav style="margin-top:7px"><button id="toggle"></button><button id="skip"></button><button id="reset"></button></nav><div id="progress"></div></main><script>
const bridge=window.tomradeSurface;let state;
const text=(id,v)=>document.getElementById(id).textContent=v;
function render(){if(!state)return;const w=state.words;const left=state.running?Math.max(0,state.deadline-Date.now()):state.remaining;const s=Math.ceil(left/1000);text('clock',String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'));text('title',w.title);text('phase',w[state.phase]);text('detail',w.done+' '+state.completed);text('toggle',state.running?w.pause:w.start);for(const a of ['skip','reset','settings'])text(a,w[a]);text('mode',w.embedded);document.getElementById('progress').style.width=Math.max(0,Math.min(1,1-left/state.duration))*100+'%'}
bridge.onState(s=>{state=s;render()});for(const action of ['toggle','skip','reset','mode','settings'])document.getElementById(action).onclick=()=>bridge.send({type:'action',action});setInterval(render,250);
</script></body></html>
