<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'"><style>
*{box-sizing:border-box}body{margin:0;background:#262b28;color:#eee9df;font:13px system-ui;padding:20px}header{font-size:18px;font-weight:600;margin-bottom:16px;-webkit-app-region:drag}label{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}input[type=number]{width:76px;padding:6px;background:#39423c;border:1px solid #66766a;border-radius:5px;color:inherit;font:inherit}input[type=checkbox]{accent-color:#c7dfaa}nav{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}button{background:#3b453e;color:inherit;border:1px solid #647365;border-radius:6px;padding:8px 16px;cursor:pointer}button[type=submit]{background:#c7dfaa;color:#263225}#error{min-height:18px;font-size:12px;color:#ffa897}input:focus-visible,button:focus-visible{outline:2px solid #c7dfaa;outline-offset:2px}
</style></head><body><header id="title"></header><form id="form"><label><span data-label="focusMinutes"></span><input name="focusMinutes" type="number" min="1" max="180" step="1" required></label><label><span data-label="shortBreakMinutes"></span><input name="shortBreakMinutes" type="number" min="1" max="60" step="1" required></label><label><span data-label="longBreakMinutes"></span><input name="longBreakMinutes" type="number" min="1" max="120" step="1" required></label><label><span data-label="longBreakEvery"></span><input name="longBreakEvery" type="number" min="1" max="12" step="1" required></label><label><span data-label="autoStart"></span><input name="autoStart" type="checkbox"></label><div id="error" role="alert"></div><nav><button type="button" id="cancel"></button><button type="submit" id="save"></button></nav></form><script>
const bridge=window.tomradeSurface,form=document.getElementById('form');let state;
bridge.onState(s=>{state=s;document.getElementById('title').textContent=s.words.settings;for(const el of document.querySelectorAll('[data-label]'))el.textContent=s.words[el.dataset.label];for(const n of ['focusMinutes','shortBreakMinutes','longBreakMinutes','longBreakEvery'])form.elements[n].value=s.config[n];form.elements.autoStart.checked=s.config.autoStart;document.getElementById('save').textContent=s.words.save;document.getElementById('cancel').textContent=s.words.cancel});document.getElementById('cancel').onclick=()=>bridge.send({type:'close'});form.onsubmit=e=>{e.preventDefault();if(!form.reportValidity())return;const rules={autoStart:form.elements.autoStart.checked};for(const n of ['focusMinutes','shortBreakMinutes','longBreakMinutes','longBreakEvery'])rules[n]=Number(form.elements[n].value);bridge.send({type:'save',rules})};
</script></body></html>
