name: Feature request
description: Something Tomrade could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and what gets in the way today. A story beats a solution here.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working, if you have an idea.
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Workarounds you use now, other tools that do it well, whether it could be a plugin.
