# Checks every pull request, a fork's included, and every push to main.
# GitHub-hosted only: a pull request's code must never run on the self-hosted
# Macs that sign and publish releases. `pull_request` (not
# `pull_request_target`) gives a fork's run no secrets and a read-only token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # The pinned pnpm, installed the same way as in release.yml.
      - name: Install pnpm
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - run: pnpm install --frozen-lockfile

      # Builds the backend too (tsc -b), which the tests import.
      - run: pnpm typecheck

      - run: pnpm test
