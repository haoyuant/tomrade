# Every v<semver> tag builds the installers on all three systems, uploads them
# to download.tomrade.com/<version>/ and attaches the update manifests to a
# draft release, which is published by hand. Publishing has the site's mirror
# write the manifests that point at the new version. macOS builds are signed
# with the Developer ID certificate and notarized; the secrets are listed in
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# One run at a time, whatever the tag: each run remakes the Mac's signing
# keychain, which another run's builds may be signing from.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The Mac builds run side by side on the Mac's runners and sign from one
  # keychain, made here from the secrets. Given CSC_LINK, electron-builder would
  # make a keychain per build and rewrite the user's keychain search list to add
  # it, and two builds at once drop each other's (errSecInternalComponent).
  keychain:
    name: Signing keychain
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - name: Import the Developer ID
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          for name in MAC_CERTS MAC_CERTS_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; exit 1; fi
          done
          kc="$HOME/Library/Keychains/tomrade-signing.keychain-db"
          security delete-keychain "$kc" 2> /dev/null || true
          security create-keychain -p "$MAC_CERTS_PASSWORD" "$kc"
          # Locks after an hour unused and when the Mac sleeps; each build unlocks it.
          security set-keychain-settings -lut 3600 "$kc"
          echo "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          security import "$RUNNER_TEMP/certs.p12" -k "$kc" -P "$MAC_CERTS_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/certs.p12"
          # So codesign uses the key without asking.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MAC_CERTS_PASSWORD" "$kc" > /dev/null
          # codesign builds the certificate chain from the search list only.
          read -ra others <<< "$(security list-keychains -d user | xargs)"
          security list-keychains -d user -s "$kc" "${others[@]}"
          security find-identity -v -p codesigning "$kc" | grep -q "Developer ID Application" \
            || { echo "::error::The keychain has no valid Developer ID Application identity"; exit 1; }

  # The builds put their update manifests on this draft themselves; the
  # installers go to R2.
  draft:
    name: Draft release
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      # A re-run finds the draft its first run made.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            flags=(--draft --verify-tag --generate-notes --title "Tomrade ${tag#v}")
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" "${flags[@]}"
          fi

  build:
    name: ${{ matrix.name }}
    needs: [keychain, draft]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # The Windows build's macOS makensis aborts on an include path of 265
      # characters or more; pnpm's folder for app-builder-lib alone is over 100.
      # An environment variable, so every later pnpm command sees what the
      # install did and doesn't try to reinstall.
      pnpm_config_virtual_store_dir_max_length: 60
    strategy:
      fail-fast: false
      matrix:
        # Every build runs on the self-hosted Mac's runners (docs/releasing.md):
        # hosted minutes run out, macOS ones tenfold.
        include:
          - { name: macOS arm64, slug: mac-arm64, os: [self-hosted, macOS, ARM64], args: --mac --arm64 }
          # Built on the arm64 Mac: pnpm installs both arches' native packages
          # and the app keeps its own (apps/desktop/scripts/after-pack.cjs).
          - { name: macOS x64, slug: mac-x64, os: [self-hosted, macOS, ARM64], args: --mac --x64, install: --cpu=arm64 --cpu=x64 }
          # Cross-built: the build's own tools need the Mac's packages, the app
          # keeps only Windows x64's.
          - { name: Windows x64, slug: win-x64, os: [self-hosted, macOS, ARM64], args: --win --x64, install: --os=darwin --os=win32 --cpu=arm64 --cpu=x64 }
          # Cross-built the same way. Nothing is compiled, so the build machine's
          # glibc doesn't matter.
          - { name: Linux x64, slug: linux-x64, os: [self-hosted, macOS, ARM64], args: --linux --x64, install: --os=darwin --os=linux --cpu=arm64 --cpu=x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # Not pnpm/action-setup: it switches to the pinned pnpm through @pnpm/exe,
      # which pnpm 11 doesn't build for Intel Macs. The JS build runs anywhere.
      - name: Install pnpm
        shell: bash
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Version from the tag
        shell: bash
        working-directory: apps/desktop
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not v<semver>"
            exit 1
          fi
          npm pkg set version="$version"

      - run: pnpm install --frozen-lockfile ${{ matrix.install }}

      # Fails rather than ship an unsigned Mac build. By slug, not runner.os: the
      # Windows job runs on the Mac too.
      - name: Signing credentials
        if: startsWith(matrix.slug, 'mac-')
        env:
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CERTS_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; exit 1; fi
          done
          # The keychain job's; electron-builder signs from it and leaves the search list alone.
          kc="$HOME/Library/Keychains/tomrade-signing.keychain-db"
          security unlock-keychain -p "$MAC_CERTS_PASSWORD" "$kc"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CSC_KEYCHAIN=$kc"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: pnpm --filter @tomrade/desktop package -- ${{ matrix.args }} --publish never

      # electron-builder notarizes the app, not the disk image around it.
      - name: Notarize the disk image
        if: startsWith(matrix.slug, 'mac-')
        run: |
          for dmg in apps/desktop/release/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Check the signature
        if: startsWith(matrix.slug, 'mac-')
        run: |
          for app in apps/desktop/release/mac*/Tomrade.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
            xcrun stapler validate "$app"
          done
          for dmg in apps/desktop/release/*.dmg; do
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
            xcrun stapler validate "$dmg"
          done

      # Straight from this Mac to download.tomrade.com/<version>/, once. Through
      # the release, every installer crossed the Mac's line three times: up to
      # GitHub, down to the site's mirror, up to R2. Nothing names these files
      # until the release is published and the mirror writes the manifests.
      - name: Upload to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Secret CLOUDFLARE_API_TOKEN is not set"; exit 1; fi
          shopt -s nullglob
          files=(apps/desktop/release/*.{dmg,zip,exe,AppImage,blockmap})
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No installers to upload"; exit 1; fi
          node apps/desktop/scripts/upload-r2.mjs "${GITHUB_REF_NAME#v}" "${files[@]}"

      # Only the update manifests go on the draft: the mirror reads them from
      # there. The Mac ones wait for the release job, which merges the two.
      - name: Upload the update manifests to the draft
        if: ${{ !startsWith(matrix.slug, 'mac-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for f in apps/desktop/release/*.yml; do
            case "$(basename "$f")" in builder-debug.yml|*-mac.yml) ;; *) files+=("$f") ;; esac
          done
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No update manifests to upload"; exit 1; fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: startsWith(matrix.slug, 'mac-')
        with:
          name: manifests-${{ matrix.slug }}
          if-no-files-found: error
          retention-days: 1
          path: apps/desktop/release/*-mac.yml

  # The plugin authors' packages on npm (scripts/npm-release.mjs): the SDK line,
  # and the app's declarations at the tag's version. Without NPM_TOKEN, a dry run.
  npm:
    name: npm packages
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        shell: bash
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Version from the tag
        shell: bash
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"

      - run: pnpm install --frozen-lockfile

      - name: Stage, verify and publish
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            # npm's write tokens live 90 days at most: one it refuses is said so here, not halfway through the packages.
            if npm whoami 2>&1 | grep -q E401; then
              echo "::error::NPM_TOKEN no longer works; npm's write tokens expire after 90 days at most. Make a granular access token with Read and write on the @tomradex scope and Bypass 2FA, then: gh secret set NPM_TOKEN -R haoyuant/tomrade (docs/releasing.md)"
              exit 1
            fi
            node scripts/npm-release.mjs --verify --publish
          else
            echo "::warning::NPM_TOKEN is not set: the npm packages are staged and checked, and nothing is published"
            node scripts/npm-release.mjs --verify --publish --dry-run
          fi

  # Once every build is on the draft. A draft without *-mac.yml had a build fail.
  release:
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      # A folder per build: both Mac builds write latest-mac.yml.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: manifests-*
          path: builds

      # Each Mac build lists only its own zip, and the updater reads one
      # manifest for both arches, so the two are merged (yq: brew install yq).
      - name: Merge the Mac update manifests
        run: |
          mkdir manifests
          for name in $(find builds -name '*-mac.yml' -exec basename {} \; | sort -u); do
            # shellcheck disable=SC2016 # $m is yq's
            yq eval-all '. as $m ireduce ({}; . *+ $m)' builds/*/"$name" > "manifests/$name"
            yq -e '[.files[].url | select(test("-mac-(arm64|x64)[.]zip$"))] | unique | length == 2' "manifests/$name" > /dev/null \
              || { echo "::error::$name does not list both Mac zips"; exit 1; }
          done

      - name: Upload the Mac update manifests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$GITHUB_REF_NAME" manifests/* --clobber
