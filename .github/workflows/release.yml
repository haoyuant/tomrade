# Every v<semver> tag builds the installers on all three systems and attaches
# them, with the update manifests, to a draft release, which is published by hand. macOS builds are signed
# with the Developer ID certificate and notarized; the secrets are listed in
# docs/releasing.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # One Mac at a time: electron-builder rewrites the user's keychain search
    # list to sign, and two at once on the same Mac drop each other's keychain.
    concurrency:
      group: ${{ startsWith(matrix.slug, 'mac-') && 'mac-signing' || format('{0}-{1}', matrix.slug, github.run_id) }}
    strategy:
      fail-fast: false
      matrix:
        # Everything but Windows runs on the self-hosted Mac (docs/releasing.md),
        # Linux in a container on it: hosted minutes run out, macOS ones tenfold.
        include:
          - { name: macOS arm64, slug: mac-arm64, os: [self-hosted, macOS, ARM64], args: --mac --arm64 }
          # An x64 runner: better-sqlite3 and the agent SDK's binary are per-arch.
          - { name: macOS x64, slug: mac-x64, os: [self-hosted, macOS, X64], args: --mac --x64 }
          - { name: Windows x64, slug: win-x64, os: windows-2025, args: --win --x64 }
          # Ubuntu 22.04, the oldest supported, so the AppImage runs on older glibc.
          - { name: Linux x64, slug: linux-x64, os: [self-hosted, Linux, X64], args: --linux --x64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      # Not pnpm/action-setup: it switches to the pinned pnpm through @pnpm/exe,
      # which pnpm 11 doesn't build for Intel Macs. The JS build runs anywhere.
      - name: Install pnpm
        shell: bash
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Version from the tag
        shell: bash
        working-directory: apps/desktop
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$GITHUB_REF_NAME is not v<semver>"
            exit 1
          fi
          npm pkg set version="$version"

      - run: pnpm install --frozen-lockfile

      # Fails rather than ship an unsigned Mac build.
      - name: Signing credentials
        if: runner.os == 'macOS'
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MAC_CERTS MAC_CERTS_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then echo "::error::Secret $name is not set"; exit 1; fi
          done
          echo "$MAC_CERTS" | base64 --decode > "$RUNNER_TEMP/certs.p12"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "CSC_LINK=$RUNNER_TEMP/certs.p12"
            echo "CSC_KEY_PASSWORD=$MAC_CERTS_PASSWORD"
            echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: pnpm --filter @tomrade/desktop package -- ${{ matrix.args }} --publish never

      # electron-builder notarizes the app, not the disk image around it.
      - name: Notarize the disk image
        if: runner.os == 'macOS'
        run: |
          for dmg in apps/desktop/release/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Check the signature
        if: runner.os == 'macOS'
        run: |
          app=$(echo apps/desktop/release/mac*/Tomrade.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app"
          xcrun stapler validate "$app"
          for dmg in apps/desktop/release/*.dmg; do
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
            xcrun stapler validate "$dmg"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.slug }}
          if-no-files-found: error
          # Only the release job reads them, and artifacts count against the
          # account's 500 MB of Actions storage; the release keeps the files.
          retention-days: 1
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            !apps/desktop/release/builder-debug.yml

  release:
    needs: build
    runs-on: [self-hosted, macOS, ARM64]
    permissions:
      contents: write
    steps:
      # A folder per build: both Mac builds write latest-mac.yml.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: builds

      # Each Mac runner lists only its own zip, and the updater reads one file
      # for both arches, so the two are merged (yq: brew install yq).
      - name: Merge the Mac update manifests
        run: |
          mkdir installers
          find builds -type f ! -name '*-mac.yml' -exec cp {} installers/ \;
          for name in $(find builds -name '*-mac.yml' -exec basename {} \; | sort -u); do
            yq eval-all '. as $m ireduce ({}; . *+ $m)' builds/*/"$name" > "installers/$name"
            yq -e '[.files[].url | select(test("-mac-(arm64|x64)[.]zip$"))] | length == 2' "installers/$name" > /dev/null \
              || { echo "::error::$name does not list both Mac zips"; exit 1; }
          done

      # A re-run replaces the files on the draft it made the first time.
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" installers/* --clobber
          else
            flags=(--draft --verify-tag --generate-notes --title "Tomrade ${tag#v}")
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" installers/* "${flags[@]}"
          fi
