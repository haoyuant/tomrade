# Publishing a release hands it to the website: the Deploy workflow in
# haoyuant/tomrade-site checks its installers are on download.tomrade.com (the
# builds uploaded them), writes the update manifests that point at them, then
# redeploys tomrade.com so the download buttons name the new version. A pre-release only reaches the beta update channel: its
# files are mirrored, the site and latest.json stay on the last release.
# A release published with GITHUB_TOKEN would not start this; publish by hand.
name: Website

on:
  release:
    types: [published, released]

permissions: {}

jobs:
  deploy:
    # A release published from a draft fires both; `released` alone is a
    # pre-release promoted later, and `published` alone a pre-release.
    if: github.event.action == 'released' || github.event.release.prerelease
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    steps:
      - name: Start the site's Deploy workflow
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret SITE_DISPATCH_TOKEN is not set"; exit 1; fi
          # --ref spares gh its default-branch lookup, which an Actions-only token is refused.
          gh workflow run deploy.yml -R haoyuant/tomrade-site --ref main -f tag="$TAG"
          echo "Mirroring $TAG: https://github.com/haoyuant/tomrade-site/actions/workflows/deploy.yml" >> "$GITHUB_STEP_SUMMARY"
