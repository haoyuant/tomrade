# Tomrade's installers. `pnpm --filter @tomrade/desktop package` builds the
# backend and the renderer first (scripts/package.mjs). Signing and
# notarizing: docs/releasing.md.
appId: com.tomrade.desktop
productName: Tomrade
# Electron names the data folder after productName. Only the installed app
# carries it; a checkout keeps its data under @tomrade/desktop. That is also
# why the desktop package alone keeps the old @tomrade scope: renaming it would
# move a checkout's data folder and its keychain key.
extraMetadata:
  productName: Tomrade
  # Linux: the window app id, matched to the desktop entry src/desktop-entry.ts writes (DESKTOP_NAME).
  # A checkout keeps Electron's own, so it never takes over the installed app's entry.
  desktopName: tomrade.desktop
copyright: Copyright © Tomrade
# tomrade:// links (an IM reply's "Open in Tomrade") start or bring forward the app: src/deep-link.ts.
protocols:
  - name: Tomrade
    schemes: [tomrade]
# One pattern for every target, so each platform and arch gets its own name.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: assets
# Where an installed build asks for updates (src/updater.ts). Each build writes
# its channel's manifest beside the installers, and the website's mirror copies
# both to R2. A release writes latest*.yml and beta*.yml, so the beta channel
# gets releases too; v1.2.0-beta.1 writes only beta*.yml (and alpha*.yml).
publish:
  provider: generic
  url: https://download.tomrade.com
  # Otherwise named after the package, @tomrade/desktop.
  updaterCacheDirName: tomrade-updater
generateUpdatesFilesForAllChannels: true
# Off on purpose: Plugin Studio runs agent-written code in a Node child with the
# permission model on, and that child — and esbuild's native binary — must be
# real files it can be allowed to read. Windows packs one anyway (win.asar).
asar: false
# scripts/after-pack.cjs repacks app.asar after pruning, so a hash taken before it would be stale.
disableAsarIntegrity: true
npmRebuild: false
afterPack: scripts/after-pack.cjs
files:
  - dist/**
  - ui/**
  - assets/**
  - preload.cjs
  - surface-preload.cjs
  - tomrade.yml
  - package.json
  # The built-in agent's Pi (scripts/fetch-pi.mjs).
  - vendor/**
  # The official starters, for a machine that cannot reach GitHub (scripts/bundle-official-plugins.mjs).
  - official-plugins/**
  - "!**/*.map"
  - "!**/*.tsbuildinfo"
mac:
  category: public.app-category.productivity
  # Built from icon-mac.png (the cat on the sun, a full rounded square macOS 26
  # shows without a grey plate) by iconutil: electron-builder's own PNG → icns
  # conversion writes 16/32/64px entries macOS decodes as noise.
  icon: assets/icon.icns
  # Signed only with a Developer ID Application certificate: without this,
  # electron-builder falls back to any other certificate in the keychain,
  # an Apple Development one included. No such certificate, no signature.
  # Notarized when the APPLE_API_* variables are set; docs/releasing.md.
  identity: Developer ID Application
  hardenedRuntime: true
  entitlements: assets/entitlements.mac.plist
  entitlementsInherit: assets/entitlements.mac.plist
  # The background part at login: SMAppService finds its LaunchAgent inside the
  # signed bundle, under Contents/Library/LaunchAgents (src/login-item.ts).
  extraFiles:
    - from: assets/launch-agent
      to: Library/LaunchAgents
  # A background Tomrade with no window still answers MCP and runs routines on
  # time; App Nap would throttle both while it is out of sight.
  extendInfo:
    LSAppNapIsDisabled: true
  target:
    - target: dmg
    - target: zip
dmg:
  # Signed with the same Developer ID; CI then notarizes and staples it.
  sign: true
win:
  icon: assets/icon.png
  target: nsis
  # The NSIS installer writes each file twice (to a temp folder, then into
  # place) and the virus scanner reads every one: thousands of small files made
  # an install take minutes. scripts/after-pack.cjs keeps real files only for
  # what must be one (its UNPACKED).
  asar: true
linux:
  icon: assets/icon.png
  # Otherwise derived from the package name, @tomrade/desktop.
  executableName: tomrade
  # The entry inside the AppImage takes desktopName's name, so AppImage integrators install one that matches the windows.
  syncDesktopName: true
  target: AppImage
  category: Office
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
