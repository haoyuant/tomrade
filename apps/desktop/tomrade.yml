# Tomrade is this list. Each row loads one plugin; load order comes from what
# each plugin injects, not from the order here. A row is replaced by id from
# <userData>/tomrade.patch.yml or a file passed with --patch, and
# `electron . --dump-config` prints the tree that actually booted.

# A module is a capability, named by the service key that carries it. Which row
# fills one is never declared: the manager reads it off the running context, so
# a plugin that loads further plugins is credited with what they provide. A
# required module may not be left empty — the switch that would do it is refused.
modules:
  - id: db
    title: Database
    required: true
  - id: hub
    title: This machine
    required: true
  - id: oplog
    title: History
    required: true
  - id: fields
    title: Fields
    required: true
  - id: items
    title: Issues
    required: true
  - id: boards
    title: Boards
    required: true
  - id: views
    title: Saved views
    required: true
  - id: projects
    title: Projects
    required: true
  - id: tools
    title: Tool registry
    required: true
  - id: contributions
    title: Contributions
    required: true
  - id: settings
    title: Settings
    required: true
  - id: ipc
    title: Renderer channels
    required: true
  - id: desktopSurfaces
    title: Desktop surfaces
    required: true
  # The registry, not the destinations. storage-git and storage-github register
  # providers into it and hold no module of their own, so either can go without
  # taking a project's own copy with it.
  - id: storage
    title: Destinations
    required: true
  - id: repos
    title: Repositories
    required: true
  # Optional, and listed so the manager can say who fills them and what is
  # lost by switching the last one off.
  - id: llm
    title: Language model
  - id: agent
    title: Assistant
  - id: mcp
    title: MCP server
  - id: mcpClient
    title: External MCP servers
  - id: codeLink
    title: Code link
  - id: files
    title: Files
  - id: notes
    title: Notes
  - id: schedules
    title: Routines
  - id: pet
    title: Pet
  - id: alerts
    title: Alerts
  - id: im
    title: IM connections
  - id: inbox
    title: Inbox
  - id: webSearch
    title: Web search

# A contract is a registry plugins plug into, named by the call that does it;
# its members are interchangeable, and the Plugins pane groups them by it.
# Unlike a module's, membership is declared on the row (`implements`): a row
# switched off registers nothing, and a disabled engine is exactly the one
# someone opens the pane to find. A running row is credited with what it
# registers as well.
contracts:
  - id: engine
    title: Engines
    registry: agent.engine
  - id: storage
    title: Destinations
    registry: storage.register
  - id: files
    title: File sharing
    registry: files.register
  - id: im
    title: IM adapters
    registry: im.register
  - id: inboxSource
    title: Inbox sources
    registry: inbox.source
  - id: inboxTriager
    title: Inbox triage
    registry: inbox.triager
  - id: webSearch
    title: Web search
    registry: webSearch.register

plugins:
  - id: archify
    name: "@tomradex/archify"
    config:
      cacheDirectory: "${userData}/runtimes/archify"
      nodeBinary: "${nodeRuntime}"
  # Caches only: every file under here can be rebuilt from a project's folder.
  - id: db
    name: "@tomradex/db"
    config:
      dir: "${userData}/cache"
  # This machine: its id and local project/repository placements. Hub metadata
  # belongs to Supabase; no local Hub state file is created.
  - id: hub
    name: "@tomradex/hub"
    config:
      catalogFile: "${userData}/catalog.json"
      deviceFile: "${userData}/device.json"
      defaultDir: "${hubDir}"
  - id: oplog
    name: "@tomradex/oplog"
  - id: write-policy
    name: "@tomradex/write"
  # The field registry: built-in fields plus each project's own. Items inject it
  # to validate custom values, so it sits beside them in the required set.
  - id: fields
    name: "@tomradex/fields"
  - id: items
    name: "@tomradex/items"
  - id: boards
    name: "@tomradex/boards"
  - id: projects
    name: "@tomradex/projects"
    config:
      legacyPath: "${userData}/tomrade.db"
      backupsDir: "${userData}/backups"
      # The first project is the onboarding row's sample, not an empty one.
      firstRun: none
  # A first run opens on the sample project, written in the system's language;
  # also the seen-hints the person carries between machines, and the playbook
  # the assistant explains Tomrade from.
  - id: onboarding
    name: "@tomradex/onboarding"
    config:
      locale: "${locale}"
  # API keys and tokens rest in settings.json encrypted by the OS keychain.
  - id: settings
    name: ./dist/settings.js
    config:
      path: "${userData}/settings.json"
      locale: "${locale}"
  # Each project's folder is the truth and the cache follows it: the log is
  # written through, the snapshot shortly after, and a folder changed by anyone
  # else is read back in. Git is driven only in folders Tomrade made itself.
  - id: storage
    name: "@tomradex/storage"
  # Announcements Tomrade publishes to every install, read through the account
  # client above whether or not anyone is signed in; each one pops up once.
  - id: announcements
    name: "@tomradex/announcements"
    config:
      file: "${userData}/announcements.json"
      version: "${appVersion}"
  # Accounts and the portable Hub catalog, in Supabase. Always on: the build
  # carries the production project's URL and publishable key, which
  # TOMRADE_SUPABASE_URL / TOMRADE_SUPABASE_PUBLISHABLE_KEY or url/publishableKey
  # here override. The account itself is optional: the Hub syncs nothing until
  # someone signs in, and without one, projects stay on this machine. Migrates
  # only Hub metadata; project storage providers below keep their role.
  - id: hub-cloud
    name: ./dist/hub-cloud.js
    config:
      userData: "${userData}"
  # The one GitHub account this machine uses — for the backlog's repository,
  # Files, code checkouts and publishing — and the git credential helper that
  # hands its token to git, so no remote URL carries it.
  # Signing in uses the Tomrade GitHub App (github.com/apps/tomradex) by the
  # device flow: the client ID is public and no secret ships in the app.
  # Without a clientId only a personal access token is offered.
  - id: github
    name: ./dist/github.js
    config:
      userData: "${userData}"
      clientId: Iv23lilOnDQLgcQBtlrt
      appSlug: tomradex
      nodeBinary: "${nodeRuntime}"
  # Remote transports for a project's own repository: any git URL…
  - id: storage-git
    name: "@tomradex/storage-git"
    implements: [storage]
  # …and GitHub as a hosting choice on top: find a repository, make one.
  - id: storage-github
    name: "@tomradex/storage-github"
    implements: [storage]
  # The code repositories workstreams stand for: shared identity in the project,
  # this machine's checkout in the catalog, a worktree per agent thread.
  - id: repos
    name: "@tomradex/repos"
  - id: llm
    name: "@tomradex/llm"
  - id: tools
    name: "@tomradex/tools"
  # A bash tool for the in-app assistant, asked before each command by default
  # (Settings → Shell). Kept off the MCP server: no outside client gets a shell.
  # Not "shell": that row is the desktop's own OS integration below.
  - id: bash
    name: "@tomradex/shell"
  # Web search and page reading as tools for every engine, answered by a
  # provider below. Optional — without a provider the tools are not offered.
  - id: web-search
    name: "@tomradex/web-search"
  # …Tavily as that provider, with the person's own API key (Settings → Tavily).
  - id: web-search-tavily
    name: "@tomradex/web-search-tavily"
    implements: [webSearch]
  # The platform: threads, runs, the ledger, run-scoped undo, and the
  # engine/workflow/playbook/policy registries. It conducts nothing itself.
  - id: agent
    name: "@tomradex/agent"
    config:
      playbooksDir: "${userData}/playbooks"
      mediaDir: "${userData}/agent-media"
  - id: im
    name: "@tomradex/im"
  # Engines are conductors; several can be installed, a thread picks one.
  # Tomrade: the one in-app choice — the built-in pi holds backlog conversations (the loop when pi cannot run,
  # a signed-in Claude Code or Codex when no model is connected) and implements tickets.
  - id: engine-tomrade
    name: "@tomradex/engine-loop/tomrade"
    title: Tomrade
    implements: [engine]
  - id: engine-loop
    name: "@tomradex/engine-loop"
    title: Tomrade loop
    implements: [engine]
  # Pi shipped inside the app, run on the model profiles: a local agent with nothing to install or sign in to.
  - id: engine-pi-builtin
    name: "@tomradex/engine-pi/builtin"
    title: Built-in agent
    implements: [engine]
    config:
      cli: "${appDir}/vendor/pi/dist/bundle/cli.js"
      home: "${userData}/pi"
      nodeBinary: "${nodeRuntime}"
  # Off until switched on in Settings → Manage plugins: a menu of workflows, no model.
  - id: engine-scripted
    name: "@tomradex/engine-scripted"
    title: Scripted (no model)
    implements: [engine]
    disabled: true
  - id: engine-claude-code
    name: "@tomradex/engine-claude-code"
    title: Claude Code
    implements: [engine]
  - id: engine-codex
    name: "@tomradex/engine-codex"
    title: Codex
    implements: [engine]
  - id: engine-pi
    name: "@tomradex/engine-pi"
    title: Pi
    implements: [engine]
  # Gemini CLI over ACP (`gemini --acp`), which a ticket can also start in a terminal;
  # Antigravity CLI (`agy`), started only in a terminal.
  - id: engine-terminal
    name: "@tomradex/engine-terminal"
    title: Gemini CLI and Antigravity CLI
    implements: [engine]
  # Agents that speak ACP (the Agent Client Protocol) over stdio, each its own row.
  - id: engine-hermes
    name: "@tomradex/engine-hermes"
    title: Hermes
    implements: [engine]
  - id: engine-dsh
    name: "@tomradex/engine-dsh"
    title: DeepSeek Harness
    implements: [engine]
  # OpenCode over ACP (`opencode acp`); a ticket can also start it in a terminal.
  - id: engine-opencode
    name: "@tomradex/engine-opencode"
    title: OpenCode
    implements: [engine]
  # Cursor's CLI (`cursor-agent`), started only in a terminal.
  - id: engine-cursor
    name: "@tomradex/engine-cursor"
    title: Cursor
    implements: [engine]
  # WorkBuddy's CLI (CodeBuddy Code): `codebuddy` on PATH, else the copy inside the WorkBuddy app.
  - id: engine-workbuddy
    name: "@tomradex/engine-workbuddy"
    title: WorkBuddy
    implements: [engine]
  # The troubleshooter: when something fails, checks what it can (the agent,
  # its sign-in, a test turn, the models), says what to do, and sends a report
  # the person has read to Tomrade's developer. Its own engine opens the
  # troubleshooting threads; the bottom bar and the palette start one.
  - id: doctor
    name: "@tomradex/doctor"
    implements: [engine]
    config:
      dataDir: "${userData}/doctor"
      logDir: "${logDir}"
      version: "${appVersion}"
  # The project's inbox: feedback and bug reports from the sources a project
  # switches on wait there until someone triages them into tickets. Optional —
  # tickets it made are ordinary tickets with Source and Kind fields.
  - id: inbox
    name: "@tomradex/inbox"
  # Tomrade's own feedback as one of those sources, for its maintainers; and the
  # in-app Feedback entry, sent through the troubleshooter's outbox.
  - id: inbox-tomrade
    name: "@tomradex/inbox-tomrade"
    implements: [inboxSource]
  # The issues of a project's GitHub repositories, answered on the issue and,
  # where the project allows it, closed once their ticket ships in a release.
  - id: inbox-github
    name: "@tomradex/inbox-github"
    implements: [inboxSource]
  # Pre-triage: the worker model proposes, for each new entry, the ticket it
  # repeats, its kind and priority, and a draft reply. A person confirms it.
  - id: inbox-triage
    name: "@tomradex/inbox-triage"
    implements: [inboxTriager]
  # The backlog method: playbooks, workflows, compound tools, the dedup policy.
  - id: agent-backlog
    name: "@tomradex/agent-backlog"
  # The dependency lens over Item.blocks: the Dependencies graph and the
  # "blocked" badge. Optional — the platform stores the edges either way.
  - id: deps-graph
    name: "@tomradex/deps-graph"
  # herdr, the terminal workspace manager coding agents run in, when this
  # machine has it: a session remembers its pane, and the ticket finds it again.
  - id: herdr
    name: "@tomradex/herdr"
    config:
      # Machine-local: whether Tomrade has started herdr's server here before, so the person is told once.
      statePath: "${userData}/herdr.json"
  # Ticket ↔ code: the branches, pull requests and coding sessions of a ticket,
  # its status read from git, and the Start button that hands a ticket to a
  # local coding agent. Optional — nothing else reads its tables.
  - id: code-link
    name: "@tomradex/code-link"
    config:
      scanMs: 120000
      # What the Start dialog last ran with, remembered per machine (never synced):
      # the agents it names are installed here or nowhere.
      defaultsPath: "${userData}/code-link.json"
  # Routines (templates in code): tickets (a daily to-do, the week's chores, a checklist) or a
  # prompt to the assistant, run by hand or on schedules. Templates travel with
  # the project; schedules run on this machine while Tomrade is open.
  - id: schedules
    name: "@tomradex/schedules"
  # The project's files: a folder tree beside the backlog, every save a
  # version, shared through a remote the project names. Optional — tickets keep
  # only versioned references, which read as unavailable without it.
  - id: files
    name: "@tomradex/files"
    implements: [files]
  # …and GitHub as where those files are shared: find a repository, make one.
  - id: files-github
    name: "@tomradex/files-github"
    implements: [files]
  # The files read as notes: wiki links and backlinks, tags, ranked full-text
  # search, links kept when a note moves. Optional — Files is the same without it.
  - id: notes
    name: "@tomradex/notes"
  - id: mcp
    name: "@tomradex/mcp"
    config:
      port: ${mcpPort}
      instance:
        kind: ${instanceKind}
        version: ${appVersion}
        dataDir: ${userData}
  # The other direction: MCP servers the person connects in Settings, their
  # tools registered beside the built-in ones. Optional — nothing depends on it.
  - id: mcp-client
    name: "@tomradex/mcp-client"
  - id: ipc
    name: ./dist/ipc.js
  - id: shell
    name: ./dist/shell.js
  # Asks download.tomrade.com for a newer release, announces it, and downloads
  # and installs only when the person says so. A checkout updates with git.
  - id: updater
    name: ./dist/updater.js
  # Tomrade without its window: closing the last one leaves the MCP server,
  # routines and sync running behind a tray icon, and the background part can
  # start at login. Both are the person's choice (Settings → Background), kept
  # per machine; switched off, closing the last window quits as before.
  - id: background
    name: ./dist/background.js
    config:
      file: "${machineData}/background.json"
  # Says when an agent waits on the person: a count on the Dock, a taskbar
  # flash, and a notification while Tomrade is in the background.
  - id: attention
    name: ./dist/attention.js
  # Opens what a tomrade:// link names (a ticket, a conversation, a file), as IM replies carry them.
  - id: deep-links
    name: ./dist/deep-link.js
  # Generic native host for feature-owned auxiliary windows. The host owns
  # Electron mechanics; a feature plugin owns whether its surface exists.
  - id: desktop-surfaces
    name: ./dist/surfaces.js
  # System notifications and sounds a feature asks for; the feature decides when.
  - id: alerts
    name: ./dist/alerts.js
  - id: contributions
    name: "@tomradex/contributions"
  # Optional task-state companion: its row switch unloads the contribution,
  # channels, listeners, timers and desktop surface together.
  - id: pet
    name: "@tomradex/pet"
    config:
      # Pets made from the user's own images stay on this machine.
      profilesDir: "${userData}/pet-profiles"
  # Which keys run which command. The defaults live with the renderer's
  # commands; this row holds only what the person rebound, in their settings.
  - id: keybindings
    name: "@tomradex/keybindings"
  - id: community
    name: "@tomradex/community"
    config:
      nodeBinary: "${nodeRuntime}"
      officialCatalog:
        cacheFile: "${userData}/official-catalog.json"
      # Pomodoro and Discord used to ship inside the app; they now come from the
      # official catalog, put on once so nobody who had them loses them. Kimi
      # Search is put on the same way, so a Kimi model can search with no setup.
      starters: ["tomrade/pomodoro", "tomrade/discord", "tomrade/kimi-search"]
      startersFile: "${userData}/official-starters.json"
  - id: plugin-studio
    name: "@tomradex/plugin-studio"
    config:
      devRoot: "${pluginsDevRoot}"
      nodeBinary: "${nodeRuntime}"
