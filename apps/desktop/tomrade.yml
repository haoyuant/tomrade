# Tomrade is this list. Each row loads one plugin; load order comes from what
# each plugin injects, not from the order here. A row is replaced by id from
# <userData>/tomrade.patch.yml or a file passed with --patch, and
# `electron . --dump-config` prints the tree that actually booted.

# A module is a capability, named by the service key that carries it. Which row
# fills one is never declared: the manager reads it off the running context, so
# a plugin that loads further plugins is credited with what they provide. A
# required module may not be left empty — the switch that would do it is refused.
modules:
  - id: db
    title: Database
    required: true
  - id: oplog
    title: History
    required: true
  - id: items
    title: Issues
    required: true
  - id: boards
    title: Boards
    required: true
  - id: views
    title: Saved views
    required: true
  - id: projects
    title: Projects
    required: true
  - id: tools
    title: Tool registry
    required: true
  - id: contributions
    title: Contributions
    required: true
  - id: settings
    title: Settings
    required: true
  - id: ipc
    title: Renderer channels
    required: true
  # Optional, and listed so the manager can say who fills them and what is
  # lost by switching the last one off.
  - id: llm
    title: Language model
  - id: assistant
    title: Assistant
  - id: mcp
    title: MCP server

plugins:
  - id: db
    name: "@tomrade/db"
    config:
      path: "${userData}/tomrade.db"
  - id: oplog
    name: "@tomrade/oplog"
  - id: write-policy
    name: "@tomrade/write"
  - id: items
    name: "@tomrade/items"
  - id: boards
    name: "@tomrade/boards"
  - id: projects
    name: "@tomrade/projects"
  - id: settings
    name: "@tomrade/settings"
    config:
      path: "${userData}/settings.json"
  - id: llm
    name: "@tomrade/llm"
  - id: tools
    name: "@tomrade/tools"
  - id: assistant
    name: "@tomrade/assistant"
  - id: mcp
    name: "@tomrade/mcp"
    config:
      port: 19090
  - id: ipc
    name: ./dist/ipc.js
  - id: contributions
    name: "@tomrade/contributions"
  # A third-party plugin: it edits nothing above, it is only listed here.
  - id: stale
    name: ../../examples/stale/dist/index.js
