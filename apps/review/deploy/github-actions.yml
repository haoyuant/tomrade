# One way to run the worker without a server: every 15 minutes, review what is
# queued and exit. Copy to .github/workflows/ in a private repository that holds
# these secrets; do not run it where pull requests from strangers can reach them.
name: plugin-review
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch: {}
concurrency: { group: plugin-review, cancel-in-progress: false }
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { repository: haoyuant/tomrade }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile --filter "@tomradex/review..." && pnpm exec tsc -b apps/review
      - run: node apps/review/dist/cli.js worker --once
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVIEW_SIGNING_KEY: ${{ secrets.REVIEW_SIGNING_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-opus-5' }}
          REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT || 'high' }}
