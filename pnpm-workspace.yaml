packages:
  - apps/*
  - packages/*

allowBuilds:
  # Both load the prebuilds they ship (N-API, no rebuild per Electron); never compiled.
  better-sqlite3: false
  electron: true
  # Squirrel.Windows only; the Windows build is NSIS.
  electron-winstaller: false
  esbuild: true
  # Loads the prebuilt binary its @koromix/koffi-<os>-<arch> package brings; never compiled.
  koffi: false
  node-pty: false

# The editor's parsers ride on caret ranges; hold them at releases that have
# been out a while rather than whatever shipped this week.
overrides:
  "@lezer/css": 1.3.8
  "@lezer/javascript": 1.5.5
  "@lezer/lr": 1.4.10
  "@lezer/markdown": 1.7.2

# xterm keeps dim and italic in a cell's background word, so WebGL painted them an
# opaque block on a clear terminal: its rectangles read colour bits only.
# Its glyphs blend alpha apart from colour: on a clear canvas alpha came out squared,
# and the page washed dim text out.
# Terminals share one glyph atlas, and it moves glyphs when its pages merge: a terminal
# whose frame was half built drew the rows before the merge from where the glyphs had been,
# and kept them so until its next frame. A frame is now built again when the atlas changed
# under it, and clearing the atlas starts it over on one page rather than leaving its
# merged pages unused for good.
# xterm's double-click walks left over a wide character's second cell without asking
# whether the character is a word separator, so a full-width mark never ended a word there.
# The Windows installer counts Tomrade's running processes with .Count, which Windows
# PowerShell leaves empty for a single one: a lone pty host or Pi was never closed.
patchedDependencies:
  '@xterm/addon-webgl@0.18.0': patches/@xterm__addon-webgl@0.18.0.patch
  '@xterm/xterm@5.5.0': patches/@xterm__xterm@5.5.0.patch
  app-builder-lib@26.15.3: patches/app-builder-lib@26.15.3.patch
  cordis@4.0.0-rc.8: patches/cordis@4.0.0-rc.8.patch
