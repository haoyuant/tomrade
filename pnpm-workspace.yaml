packages:
  - apps/*
  - packages/*
  - examples/*

allowBuilds:
  better-sqlite3: true
  electron: true
  # Squirrel.Windows only; the Windows build is NSIS.
  electron-winstaller: false
  esbuild: true

# @electron/rebuild transitively depends on @electron/node-gyp (git-hosted).
blockExoticSubdeps: false

# The editor's parsers ride on caret ranges; hold them at releases that have
# been out a while rather than whatever shipped this week.
overrides:
  "@lezer/css": 1.3.8
  "@lezer/javascript": 1.5.5
  "@lezer/lr": 1.4.10
  "@lezer/markdown": 1.7.2
