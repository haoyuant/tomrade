# BEGIN TOMRADE MCP
[mcp_servers.tomrade]
url = "http://127.0.0.1:19090/mcp/014ce729-9739-41b5-a148-8d73f7825928"
# END TOMRADE MCP

# BEGIN TOMRADE HOOKS
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "set tomrade \"$(Remove-Item Alias:curl -Force -ErrorAction Ignore 2>&1)\"; set tomrade \"$(curl -s -m 2 -X POST -H \"Content-Type: application/json\" -H \"X-Tomrade-Herdr-Pane: $HERDR_PANE_ID\" -H \"X-Tomrade-Terminal: $TERM_PROGRAM\" -H \"X-Tomrade-WT: $WT_SESSION\" -H \"X-Tomrade-Agent: codex\" --data-binary \"@-\" \"http://127.0.0.1:19090/sessions/event\" 2>&1)\"; exit 0"
timeout = 3

